        const closeBtn = document.getElementsByClassName('close')[0];
        const searchInput = document.getElementById('searchInput');
        const scrollToTopBtn = document.getElementById('scrollToTop');

        // 渲染卡片
        function renderCards(data) {
            cardsContainer.innerHTML = '';
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <span class="rank">${item.rank}</span>
                    <h2>${item.title}</h2>
                    <p class="description">${item.description}</p>
                    <div style="margin-top: 10px;">
                        <span class="tag">點擊查看詳情</span>
                    </div>
                `;
                card.addEventListener('click', () => showModal(item));
                cardsContainer.appendChild(card);
            });
        }

        // 顯示模態視窗
        function showModal(item) {
            modalTitle.textContent = `${item.rank}: ${item.title}`;
            modalSubtitle.textContent = item.englishTitle;
            
            let bodyHTML = `
                <h3>📊 背景說明</h3>
                <p>${item.details.background}</p>
            `;

            if (item.details.stats) {
                bodyHTML += `
                    <h3>📈 統計資料</h3>
                    <div class="stats">
                `;
                for (let [key, value] of Object.entries(item.details.stats)) {
                    bodyHTML += `
                        <div class="stat-item">
                            <div class="number">${value}</div>
                            <div class="label">${key}</div>
                        </div>
                    `;
                }
                bodyHTML += `</div>`;
            }

            if (item.details.description) {
                bodyHTML += `
                    <h3>📝 詳細說明</h3>
                    <p>${item.details.description}</p>
                `;
            }

            if (item.details.keyPoints) {
                bodyHTML += `<h3>🔑 關鍵要點</h3><ul>`;
                item.details.keyPoints.forEach(point => {
                    bodyHTML += `<li>${point}</li>`;
                });
                bodyHTML += `</ul>`;
            }

            if (item.details.keyIssues) {
                bodyHTML += `<h3>⚠️ 關鍵問題</h3><ul>`;
                item.details.keyIssues.forEach(issue => {
                    bodyHTML += `<li>${issue}</li>`;
                });
                bodyHTML += `</ul>`;
            }

            if (item.details.vulnerabilities) {
                bodyHTML += `<h3>🔴 常見漏洞</h3><ul>`;
                item.details.vulnerabilities.forEach(vuln => {
                    bodyHTML += `<li>${vuln}</li>`;
                });
                bodyHTML += `</ul>`;
            }

            if (item.details.injectionTypes) {
                bodyHTML += `<h3>💉 常見注入類型</h3><ul>`;
                item.details.injectionTypes.forEach(type => {
                    bodyHTML += `<li>${type}</li>`;
                });
                bodyHTML += `</ul>`;
            }

            if (item.details.prevention) {
                bodyHTML += `<h3>🛡️ 如何預防</h3><ul>`;
                item.details.prevention.forEach(prev => {
                    bodyHTML += `<li>${prev}</li>`;
                });
                bodyHTML += `</ul>`;
            }

            if (item.details.warning) {
                bodyHTML += `
                    <div class="highlight" style="background: #ffebee; border-left-color: #f44336;">
                        <strong>⚠️ 重要警告</strong>
                        <p>${item.details.warning}</p>
                    </div>
                `;
            }

            if (item.details.examples) {
                bodyHTML += `<h3>💡 攻擊情境範例</h3>`;
                item.details.examples.forEach(example => {
                    bodyHTML += `
                        <div class="highlight">
                            <strong>${example.title}</strong>
                            <p>${example.description}</p>
                            ${example.code ? `<div class="code-example">${example.code}</div>` : ''}
                        </div>
                    `;
                });
            }

            if (item.details.relatedTopics) {
                bodyHTML += `<h3>🔗 相關主題</h3>`;
                item.details.relatedTopics.forEach(topic => {
                    bodyHTML += `
                        <div class="highlight" style="background: #e3f2fd; border-left-color: #2196f3;">
                            <strong>${topic.title}</strong>
                            <p>${topic.description}</p>
                        </div>
                    `;
                });
            }

            modalBody.innerHTML = bodyHTML;
            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        // 關閉模態視窗
        closeBtn.onclick = function() {
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = 'none';
                document.body.style.overflow = 'auto';
            }
        }

        // 搜尋功能
        searchInput.addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const filteredData = owaspData.filter(item => 
                item.title.toLowerCase().includes(searchTerm) ||
                item.englishTitle.toLowerCase().includes(searchTerm) ||
                item.description.toLowerCase().includes(searchTerm) ||
                item.rank.toLowerCase().includes(searchTerm)
            );
            renderCards(filteredData);
        });

        // 回到頂部功能
        window.onscroll = function() {
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                scrollToTopBtn.style.display = 'flex';
            } else {
                scrollToTopBtn.style.display = 'none';
            }
        };

        scrollToTopBtn.onclick = function() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        };

        // 初始化
        renderCards(owaspData);
    </script>
